name: TibberMenuBar
options:
  bundleIdPrefix: nl.newstory
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  TibberCore:
    path: Packages/TibberCore
targets:
  TibberMenuBar:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist", "*.entitlements"]
    dependencies:
      - package: TibberCore
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Tibber Menu Bar
        CFBundleDisplayName: Tibber Menu Bar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: AppIcon
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
    entitlements:
      path: App/TibberMenuBar.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.newstory.tibbermenubar
        PRODUCT_NAME: Tibber Menu Bar
        ENABLE_HARDENED_RUNTIME: YES
schemes:
  TibberMenuBar:
    build:
      targets:
        TibberMenuBar: all
    run:
      config: Debug
